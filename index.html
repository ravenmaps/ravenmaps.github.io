<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>routes per stop</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

<script src="https://api.mapbox.com/mapbox-gl-js/v2.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.4.0/mapbox-gl.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.auto.min.js"></script>

<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }

#menu {
    background: #ccf2ff;
    position: absolute;
    z-index: 1;
    top: 10px;
    left: 10px;
    border-radius: 3px;
    width: 140px;
    border: 1px solid rgba(0,0,0,0.4);
    font-family: 'Open Sans', sans-serif;
}

#menu a {
    font-size: 13px;
    color: #F70D1A;
    display: block;
    padding: 10px;
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.25);
    text-align: center;
}

#menu a.active {
    background-color: #3887be;
    color: #fff;
}

#menu a:last-child { border-bottom: none; }

#fly {
    position: absolute;
    bottom: 100px;
    left: 10px;
    width: 120px;
    height: 40px;
    border: none;
    border-radius: 3px;
    color: #fff;
    background: #ee8a65;
}
</style>
</head>

<body>

<nav id="menu"></nav>
<div id="map"></div>
<button id="fly">Sydney</button>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoidGh1bGVtYXBzIiwiYSI6ImNqM3F0Y2JnaDAxYnQzM28xZDVwazhhaDEifQ.pofHlcCOkr9OXfKsMYAAFw';

var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/thulemaps/clbakxwlt001a15uykj4gmsd3',
    center: [150.98, -33.898],
    zoom: 10,
    projection: 'globe'
});

var toggleableLayerIds = {
    "routes per stop": ["routes per stop"],
    "satellite": ["satellite"],
    "traffic": ["traffic"],
    "contours": ["contours"],
    "drinking water": ["drinking-water", "drinking-water-labels"],
    "Pubs": ["pubs", "pubs-labels"],
    "Bakeries": ["bakeries", "bakeries-labels"],
    "Cafes": ["cafes", "cafes-labels"]
};

// ---------- DATA FETCHERS ----------

async function fetchDrinkingWater() {
    const b = map.getBounds();
    const q = `
    [out:json];
    node["amenity"="drinking_water"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});
    out body;`;
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q));
    const d = await r.json();
    return {
        type: "FeatureCollection",
        features: d.elements.map(e => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [e.lon, e.lat] },
            properties: { name: "Drinking water" }
        }))
    };
}

async function fetchPubs() {
    const b = map.getBounds();
    const q = `
    [out:json];
    node["amenity"="pub"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});
    out body;`;
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q));
    const d = await r.json();
    return {
        type: "FeatureCollection",
        features: d.elements.map(e => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [e.lon, e.lat] },
            properties: { name: e.tags?.name || "Pub" }
        }))
    };
}

async function fetchBakeries() {
    const b = map.getBounds();
    const q = `
    [out:json];
    (
      node["shop"="bakery"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});
      node["amenity"="bakery"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});
    );
    out body;`;
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q));
    const d = await r.json();
    return {
        type: "FeatureCollection",
        features: d.elements.map(e => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [e.lon, e.lat] },
            properties: { name: e.tags?.name || "Bakery" }
        }))
    };
}

async function fetchCafes() {
    const b = map.getBounds();
    const q = `
    [out:json];
    node["amenity"="cafe"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});
    out body;`;
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q));
    const d = await r.json();
    return {
        type: "FeatureCollection",
        features: d.elements.map(e => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [e.lon, e.lat] },
            properties: { name: e.tags?.name || "Cafe" }
        }))
    };
}

// ---------- MAP LOAD ----------

map.on('load', () => {

    function addPointWithLabels(id, color, textColor) {
        map.addSource(id, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

        map.addLayer({
            id: id,
            type: 'circle',
            source: id,
            paint: {
                'circle-radius': 6,
                'circle-color': color,
                'circle-stroke-color': '#fff',
                'circle-stroke-width': 1
            },
            layout: { visibility: 'none' }
        });

        map.addLayer({
            id: id + '-labels',
            type: 'symbol',
            source: id,
            layout: {
                'text-field': ['get', 'name'],
                'text-size': 12,
                'text-offset': [0, 1.2],
                'visibility': 'none'
            },
            paint: { 'text-color': textColor }
        });
    }

    addPointWithLabels('drinking-water', '#00BFFF', '#00688B');
    addPointWithLabels('pubs', '#FF4500', '#8B0000');
    addPointWithLabels('bakeries', '#8B4513', '#5A2D0C');
    addPointWithLabels('cafes', '#6F4E37', '#4B2E1A');

    // TOGGLES
    for (const name in toggleableLayerIds) {
        const layers = toggleableLayerIds[name];
        const link = document.createElement('a');
        link.textContent = name;
        link.href = '#';

        link.onclick = async e => {
            e.preventDefault();

            const visible = map.getLayoutProperty(layers[0], 'visibility') === 'visible';

            layers.forEach(id =>
                map.setLayoutProperty(id, 'visibility', visible ? 'none' : 'visible')
            );

            link.className = visible ? '' : 'active';

            if (!visible) {
                if (name === 'drinking water')
                    map.getSource('drinking-water').setData(await fetchDrinkingWater());
                if (name === 'Pubs')
                    map.getSource('pubs').setData(await fetchPubs());
                if (name === 'Bakeries')
                    map.getSource('bakeries').setData(await fetchBakeries());
                if (name === 'Cafes')
                    map.getSource('cafes').setData(await fetchCafes());
            }
        };

        document.getElementById('menu').appendChild(link);
    }

    document.getElementById('fly').onclick = () => {
        map.flyTo({ center: [151.0652, -33.8468], zoom: 10 });
    };
});
</script>
</body>
</html>
