}

.team {

/* =======================
   FUNCTIONS
======================= */
function flagImg(name){
    const code = teams[name];
    return code ? `<img src="https://flagcdn.com/w40/${code}.png">` : "";
}

function teamLabel(name){
    return `<span class="team">${flagImg(name)} ${name}</span>`;
}

function getGroup(text){
    const m = text.match(/Group ([A-L])/i);
    return m ? m[1] : null;
}

/* =======================
   RENDER (GROUP SHOWN)
======================= */
function render(){
    const grid = document.getElementById("grid");
    const search = document.getElementById("search").value.toLowerCase();
    const filter = document.getElementById("filter").value;

    grid.innerHTML = "";

    matches
    .filter(m => (!filter || m[1] === filter) && m.join(" ").toLowerCase().includes(search))
    .forEach(m => {

        let stageLabel = m[1];

        if(m[1] === "Group Stage"){
            const g = getGroup(m[2]) || getGroup(m[3]);
            if(g) stageLabel = `Group ${g}`;
        }

        grid.innerHTML += `
        <div class="card">

            <div class="top">
                <span>Match ${m[0]}</span>
                <span class="badge">${stageLabel}</span>
            </div>

            <div class="match">
                ${teamLabel(m[2])} - ${teamLabel(m[3])}
            </div>

            <div class="meta">
                📅 ${m[4]} • 🕒 ${m[5]}<br>
                📍 ${m[6]} — ${m[7]}
            </div>

        </div>`;
    });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);
