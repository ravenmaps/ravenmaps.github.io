function forwardGeocoder(query) {
        const matchingFeatures = [];
        for (const feature of customData.features) {

            }
        }

function forwardGeocoder(query) {

if (

.toLowerCase()

// layers uppi til vinstri
var toggleableLayerIds = ['routes per stop', 'satellite', 'traffic', 'contours' ];

for (var i = 0; i < toggleableLayerIds.length; i++) {
    var id = toggleableLayerIds[i];

    var link = document.createElement('a');
    link.href = '#';
    link.className = 'inactive';
    link.textContent = id;

    link.onclick = function (e) {
        var clickedLayer = this.textContent;
        e.preventDefault();
        e.stopPropagation();

        var visibility = map.getLayoutProperty(clickedLayer, 'visibility');

        if (visibility === 'visible') {
            map.setLayoutProperty(clickedLayer, 'visibility', 'none');
            this.className = '';
        } else {
            this.className = 'active';
            map.setLayoutProperty(clickedLayer, 'visibility', 'visible');
        }
    };

    var layers = document.getElementById('menu');
    layers.appendChild(link);
}

const MAPILLARY_TOKEN = "MLY|25284089057948616|741f6dde55deedb7fefe14f88ebc0a2a";

map.on('click', 'routes per stop', function (e) {
    const lat = e.lngLat.lat;
    const lng = e.lngLat.lng;

    // For each feature (stop) clicked
    e.features.forEach(async function(feature) {
        let mapillaryHTML = '';

        try {
            // Fetch nearest Mapillary image
            const response = await fetch(
                `https://graph.mapillary.com/images?access_token=YOUR_TOKEN&fields=id,thumb_256_url&closeto=${lng},${lat}&radius=200&limit=1
`
            );
            const data = await response.json();

            if (data.data && data.data.length > 0) {
                const image = data.data[0];
                const imageUrl = image.thumb_256_url;
                const viewerLink = `https://www.mapillary.com/app/?pKey=${image.id}`;

                mapillaryHTML = `
                    <b>Mapillary:</b><br>
                    <a href="${viewerLink}" target="_blank">
                        <img src="${imageUrl}" style="width:100%; border-radius:4px;">
                    </a>
                `;
            } else {
                mapillaryHTML = '<b>Mapillary:</b> No image found nearby.';
            }
        } catch (err) {
            console.error(err);
            mapillaryHTML = '<b>Mapillary:</b> Error fetching image.';
        }

        // Create popup **after** fetching image
        const popupHTML = `
            <b>TSN:</b> ${feature.properties.stop_id}<br>
            <b>Routes:</b> ${feature.properties.route_short_name}<br>
            <a href="https://www.transportnsw.info/trip/" target="_blank">Trip Planner</a><br><br>
            ${mapillaryHTML}
        `;

        new mapboxgl.Popup()
            .setLngLat([lng, lat])
            .setHTML(popupHTML)
            .addTo(map);
    });
});
